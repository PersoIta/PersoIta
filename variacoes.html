<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Gestão Loja - Variações</title>

  <link
    rel="stylesheet"
    href="styles.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script
    src="app.js">
  </script>

</head>

<body data-page="variacoes">

  <div
    id="app"
    class="app">

    <div id="menu"></div>

    <main class="main">

      <div class="topbar">

        <div>

          <h1>
            Variações
          </h1>

          <div
            class="muted"
            id="pageSubtitle">
          </div>

        </div>

        <div class="user-info">

          <br>

          <span id="userEmail"></span>

        </div>

      </div>

      <div id="content">

        <div class="section">

          <div class="section-head">

            <div>

              <h2>
                Variações cadastradas
              </h2>

              <div
                class="muted">
                Gerencie as variações, estoque e imagens dos produtos.
              </div>

            </div>

            <button
              class="btn btn-primary"
              onclick="newVariation()">

              + Nova variação

            </button>

          </div>

          <div
            id="variationsTable"
            class="loading">

            Carregando...

          </div>

        </div>

      </div>

    </main>

  </div>

  <div
    id="modal"
    class="modal hidden">

    <div class="modal-card">

      <div class="modal-head">

        <h2 id="modalTitle">
          Nova variação
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>

      <div id="modalContent"></div>

    </div>

  </div>

  <script
    src="variacoes.js"
    defer>
  </script>

</body>

</html>

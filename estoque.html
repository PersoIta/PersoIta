<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Gestão Loja - Estoque</title>

  <link
    rel="stylesheet"
    href="styles.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script
    src="app.js">
  </script>

  <script
    src="estoque.js"
    defer>
  </script>

</head>

<body data-page="estoque">

  <div
    id="app"
    class="app">

    <div id="menu"></div>

    <main class="main">

      <div class="topbar">

        <div>

          <h1>
            Estoque
          </h1>

          <div
            class="muted"
            id="pageSubtitle">
          </div>

        </div>

        <div class="user-info">
          <br>

          <span id="userEmail"></span>

        </div>

      </div>

      <div id="content">

        <div class="section">

          <div class="section-head">
            <h2>
              Estoque atual
            </h2>

            <button
              class="btn btn-primary"
              onclick="openMovement()">

              + Movimentar estoque

            </button>

          </div>

          <div class="section-filters">

            <select
              id="filterCategory"
              class="filter-select"
              onchange="applyStockFilters()">

              <option value="">
                Todas as categorias
              </option>

            </select>

            <select
              id="filterStatus"
              class="filter-select"
              onchange="applyStockFilters()">

              <option value="">
                Todos os status
              </option>

              <option value="normal">
                Normal
              </option>

              <option value="baixo">
                Estoque baixo
              </option>

              <option value="sem">
                Sem estoque
              </option>

            </select>

          </div>

          <div
            id="stockTable"
            class="loading">

            Carregando...

          </div>

        </div>

      </div>

    </main>

  </div>

  <div
    id="modal"
    class="modal hidden">

    <div class="modal-card">

      <div class="modal-head">

        <h2 id="modalTitle">
          Cadastro
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>

      <div id="modalContent"></div>

    </div>

  </div>

</body>

</html>

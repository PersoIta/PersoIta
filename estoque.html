<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Gestão Loja - Estoque</title>

  <link
    rel="stylesheet"
    href="styles.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script
    src="app.js">
  </script>

</head>

<body data-page="estoque">

  <div
    id="app"
    class="app">

    <div id="menu"></div>

    <main class="main">

      <div class="topbar">

        <div>

          <h1>
            Estoque
          </h1>

          <div
            class="muted"
            id="pageSubtitle">
          </div>

        </div>

        <div class="user-info">
          <br>

          <span id="userEmail"></span>

        </div>

      </div>

      <div id="content">

        <div class="section">

          <div class="section-head">

            <h2>
              Estoque atual
            </h2>

            <button
              class="btn btn-primary"
              onclick="openMovement()">

              + Movimentar estoque

            </button>

          </div>

          <div
            id="stockTable"
            class="loading">

            Carregando...

          </div>

        </div>

      </div>

    </main>

  </div>

  <div
    id="modal"
    class="modal hidden">

    <div class="modal-card">

      <div class="modal-head">

        <h2 id="modalTitle">
          Cadastro
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>

      <div id="modalContent"></div>

    </div>

  </div>

  <script>

    let products = [];

    let variations = [];

    let stockItems = [];

    let clients = [];

    let suppliers = [];


    async function loadProducts() {

      const result = await db
        .from("gestao_loja_produtos")
        .select(`
          id,
          id_loja,
          nome,
          sku,
          estoque,
          estoque_minimo,
          ativo
        `)
        .eq(
          "id_loja",
          currentStore.id_loja
        )
        .order("nome");

      if (result.error) {
        throw result.error;
      }

      products =
        result.data || [];

    }


    async function loadVariations() {

      const result = await db
        .from("gestao_loja_produtos_variacoes")
        .select(`
          id,
          id_loja,
          produto_id,
          nome,
          sku,
          estoque,
          estoque_minimo,
          ativo
        `)
        .eq(
          "id_loja",
          currentStore.id_loja
        )
        .order("nome");

      if (result.error) {
        throw result.error;
      }

      variations =
        result.data || [];

    }


    async function loadClients() {

      const result = await db
        .from("gestao_loja_clientes")
        .select(`
          id,
          nome
        `)
        .eq(
          "id_loja",
          currentStore.id_loja
        )
        .eq(
          "ativo",
          true
        )
        .order("nome");

      if (result.error) {
        throw result.error;
      }

      clients =
        result.data || [];

    }


    async function loadSuppliers() {

      const result = await db
        .from("gestao_loja_fornecedores")
        .select(`
          id,
          razao_social,
          nome_fantasia,
          cpf_cnpj,
          email,
          telefone,
          whatsapp,
          contato_responsavel,
          cep,
          endereco,
          numero,
          complemento,
          bairro,
          cidade,
          estado,
          observacoes
        `)
        .eq(
          "id_loja",
          currentStore.id_loja
        )
        .eq(
          "ativo",
          true
        )
        .order("razao_social");

      if (result.error) {
        throw result.error;
      }

      suppliers =
        result.data || [];

    }


    async function loadStock() {

      await Promise.all([
        loadProducts(),
        loadVariations()
      ]);

      const productIdsWithVariations =
        new Set(
          variations.map(function(v) {

            return String(
              v.produto_id
            );

          })
        );


      stockItems = [];


      products.forEach(function(product) {

        const hasVariations =
          productIdsWithVariations.has(
            String(product.id)
          );


        if (!hasVariations) {

          stockItems.push({

            type: "produto",

            id:
              product.id,

            produto_id:
              product.id,

            produto_nome:
              product.nome,

            produto_sku:
              product.sku,

            variacao_nome:
              null,

            sku:
              product.sku,

            estoque:
              Number(
                product.estoque || 0
              ),

            estoque_minimo:
              Number(
                product.estoque_minimo || 0
              ),

            ativo:
              product.ativo

          });

        }

      });


      variations.forEach(function(variation) {

        const product =
          products.find(function(p) {

            return String(p.id) ===
              String(
                variation.produto_id
              );

          });


        stockItems.push({

          type:
            "variacao",

          id:
            variation.id,

          produto_id:
            variation.produto_id,

          produto_nome:
            product
              ? product.nome
              : "Produto não encontrado",

          produto_sku:
            product
              ? product.sku
              : null,

          variacao_nome:
            variation.nome,

          sku:
            variation.sku,

          estoque:
            Number(
              variation.estoque || 0
            ),

          estoque_minimo:
            Number(
              variation.estoque_minimo || 0
            ),

          ativo:
            variation.ativo

        });

      });


      stockItems.sort(function(a, b) {

        const productCompare =
          a.produto_nome.localeCompare(
            b.produto_nome,
            "pt-BR"
          );


        if (productCompare !== 0) {

          return productCompare;

        }


        const variationA =
          a.variacao_nome || "";

        const variationB =
          b.variacao_nome || "";


        return variationA.localeCompare(
          variationB,
          "pt-BR"
        );

      });

    }


    async function renderStock() {

      try {

        await loadStock();

      } catch (error) {

        console.error(
          "Erro ao carregar estoque:",
          error
        );


        $("stockTable").innerHTML =
          '<div class="message error">' +
          escapeHtml(
            error.message
          ) +
          '</div>';

        return;

      }


      if (!stockItems.length) {

        $("stockTable").innerHTML =
          '<div class="empty">' +
          'Nenhum produto cadastrado para controlar o estoque.' +
          '</div>';

        return;

      }


      $("stockTable").innerHTML = `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  Produto
                </th>

                <th>
                  Variação
                </th>

                <th>
                  SKU
                </th>

                <th>
                  Estoque
                </th>

                <th>
                  Mínimo
                </th>

                <th>
                  Situação
                </th>

              </tr>

            </thead>

            <tbody>

              ${stockItems.map(function(item) {

                const low =
                  Number(
                    item.estoque
                  ) <=
                  Number(
                    item.estoque_minimo
                  );


                return `

                  <tr>

                    <td>

                      <strong>

                        ${escapeHtml(
                          item.produto_nome
                        )}

                      </strong>

                      ${
                        item.produto_sku
                          ? `

                            <br>

                            <span class="muted">

                              ${escapeHtml(
                                item.produto_sku
                              )}

                            </span>

                          `
                          : ""
                      }

                    </td>


                    <td>

                      ${
                        item.variacao_nome
                          ? escapeHtml(
                              item.variacao_nome
                            )
                          : `

                            <span class="muted">

                              Sem variação

                            </span>

                          `
                      }

                    </td>


                    <td>

                      ${escapeHtml(
                        item.sku || "-"
                      )}

                    </td>


                    <td>

                      <strong>

                        ${item.estoque}

                      </strong>

                    </td>


                    <td>

                      ${item.estoque_minimo}

                    </td>


                    <td>

                      <span
                        class="badge ${
                          low
                            ? "badge-red"
                            : "badge-green"
                        }">

                        ${
                          low
                            ? "Estoque baixo"
                            : "Normal"
                        }

                      </span>

                    </td>

                  </tr>

                `;

              }).join("")}

            </tbody>

          </table>

        </div>

      `;

    }


    function updateMovementFields() {

      const type =
        $("m_tipo").value;


      const entityContainer =
        $("movementEntityContainer");


      const supplierContainer =
        $("supplierContainer");


      const clientContainer =
        $("clientContainer");


      const supplierSelect =
        $("m_fornecedor");


      const clientSelect =
        $("m_cliente");


      const adjustmentContainer =
        $("adjustmentTypeContainer");


      if (adjustmentContainer) {

        adjustmentContainer.style.display =
          type === "Ajuste"
            ? "block"
            : "none";

      }


      if (supplierContainer) {

        supplierContainer.style.display =
          type === "Entrada"
            ? "block"
            : "none";

      }


      if (clientContainer) {

        clientContainer.style.display =
          type === "Saída"
            ? "block"
            : "none";

      }


      if (entityContainer) {

        entityContainer.style.display =
          type === "Ajuste"
            ? "none"
            : "block";

      }


      if (supplierSelect) {

        supplierSelect.required =
          type === "Entrada";


        if (type !== "Entrada") {

          supplierSelect.value = "";

        }

      }


      if (clientSelect) {

        clientSelect.required =
          type === "Saída";


        if (type !== "Saída") {

          clientSelect.value = "";

        }

      }

    }


    function openMovement() {

      if (!stockItems.length) {

        alert(
          "Não existem produtos para movimentar o estoque."

        return;

      }


      openModal(

        "Movimentar estoque",

        `

          <form
            onsubmit="saveMovement(event)">


            <label>

              Produto / Variação *

            </label>


            <select
              id="m_item"
              required
              onchange="updateStockWarning()">

              <option value="">

                Selecione

              </option>


              ${stockItems.map(function(item) {

                const variationText =
                  item.variacao_nome
                    ? " — " +
                      item.variacao_nome
                    : " — Sem variação";


                return `

                  <option
                    value="${item.type}:${item.id}">

                    ${escapeHtml(
                      item.produto_nome
                    )}

                    ${escapeHtml(
                      variationText
                    )}

                    — Estoque:

                    ${item.estoque}

                  </option>

                `;

              }).join("")}


            </select>


            <div class="grid2">


              <div>

                <label>

                  Tipo *

                </label>


                <select
                  id="m_tipo"

                  <option value="Entrada">

                    Entrada

                  <option value="Saída">

                    Saída

                  <option value="Ajuste">

                    Ajuste

                  </option>


                </select>

              </div>


              <div>

                <label>

                  Quantidade *

                <input

            <div

            <div
              id="adjustmentTypeContainer"
              style="display:none; margin-top:14px;">

              <label>

                Tipo de ajuste *

              </label>


              <div
                style="
                  display:flex;
                  gap:18px;
                  align-items:center;
                  flex-wrap:wrap;
                  padding:10px 0;
                ">

                <label
                  style="

                    margin:0;
                    cursor:pointer;
                  ">

                  <input

                <label

                    align-items:center;
                    gap:7px;
                    margin:0;
                    cursor:pointer;
                  ">

                  <input
                    type="radio"
                    name="m_ajuste_tipo"

                  Acerto positivo

                </label>

              </div>

            </div>


            <div

              <div

                <label>

                  Fornecedor *

                </label>


                <div

                  <div style="flex:1;">

                    <select
                      id="m_fornecedor">

                      <option value="">

                        Selecione o fornecedor

                      </option>


                      ${suppliers.map(function(supplier) {

                        const supplierName =
                          supplier.nome_fantasia ||
                          supplier.razao_social ||
                          "Fornecedor";


                        return `

                          <option
                            value="${supplier.id}">

                            ${escapeHtml(
                              supplierName
                            )}

                          </option>

                        `;

                      }).join("")}


                    </select>

                  </div>


                  <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="openSupplierForm()">

                    + Cadastrar fornecedor

                  </button>


                </div>

              </div>


              <div
                id="clientContainer"
                style="display:none;">


                <label>

                  Cliente *

                </label>


                <div
                  style="display:flex;gap:8px;align-items:flex-end;">


                  <div style="flex:1;">

                    <select
                      id="m_cliente">

                      <option value="">

                        Selecione o cliente

                      </option>


                      ${clients.map(function(client) {

                        return `

                          <option
                            value="${client.id}">

                            ${escapeHtml(
                              client.nome
                            )}

                          </option>

                        `;

                      }).join("")}


                    </select>

                  </div>


                  <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="openClientForm()">

                    + Cadastrar cliente

                  </button>


                </div>

              </div>


            </div>


            <label>

              Motivo

            </label>


            <input
              id="m_motivo"
              placeholder="Ex.: compra, venda, perda...">


            <label>

              Observação

            </label>


            <textarea
              id="m_obs"
              rows="3"></textarea>


            <button
              class="btn btn-primary full"
              type="submit">

              Registrar movimentação

            </button>


          </form>

        `

      );


      loadMovementEntities();

    }


    function updateStockWarning() {

      const warning =
        $("stockWarning");


      if (!warning) {
        return;
      }


      const type =
        $("m_tipo")
          ? $("m_tipo").value
          : "";


      const quantity =
        $("m_qtd")
          ? Number(
              $("m_qtd").value || 0
            )
          : 0;


      const itemValue =
        $("m_item")
          ? $("m_item").value
          : "";


      if (
        type !== "Saída" ||
        !quantity ||
        !itemValue
      ) {

        warning.style.display =
          "none";

        warning.innerHTML = "";

        return;

      }


      const parts =
        itemValue.split(":");


      const itemType =
        parts[0];


      const itemId =
        parts[1];


      const item =
        stockItems.find(function(x) {

          return x.type === itemType &&
            String(x.id) ===
            String(itemId);

        });


      if (!item) {

        warning.style.display =
          "none";

        warning.innerHTML = "";

        return;

      }


      const estoqueAtual =
        Number(
          item.estoque || 0
        );


      if (quantity > estoqueAtual) {

        const falta =
          quantity -
          estoqueAtual;


        warning.style.display =
          "block";


        warning.innerHTML = `

          <div
            style="
              margin:10px 0;
              padding:12px;
              border:1px solid #dc2626;
              border-radius:8px;
              background:#fef2f2;
              color:#991b1b;
            ">

            <strong>
              ⚠️ Estoque insuficiente
            </strong>

            <br>

            Estoque atual:
            <strong>${estoqueAtual}</strong>

            <br>

            Quantidade solicitada:
            <strong>${quantity}</strong>

            <br>

            Faltam:
            <strong>${falta}</strong>

          </div>

        `;

      } else {

        warning.style.display =
          "none";

        warning.innerHTML = "";

      }

    }


    async function loadMovementEntities() {

      try {

        await Promise.all([

          loadClients(),

          loadSuppliers()

        ]);


        const supplierSelect =
          $("m_fornecedor");


        const clientSelect =
          $("m_cliente");


        if (supplierSelect) {

          supplierSelect.innerHTML = `

            <option value="">

              Selecione o fornecedor

            </option>


            ${suppliers.map(function(supplier) {

              const supplierName =
                supplier.nome_fantasia ||
                supplier.razao_social ||
                "Fornecedor";


              return `

                <option
                  value="${supplier.id}">

                  ${escapeHtml(
                    supplierName
                  )}

                </option>

              `;

            }).join("")}

          `;

        }


        if (clientSelect) {

          clientSelect.innerHTML = `

            <option value="">

              Selecione o cliente

            </option>


            ${clients.map(function(client) {

              return `

                <option
                  value="${client.id}">

                  ${escapeHtml(
                    client.nome
                  )}

                </option>

              `;

            }).join("")}

          `;

        }


        updateMovementFields();


      } catch (error) {

        console.error(
          "Erro ao carregar clientes e fornecedores:",
          error
        );


        alert(
          "Erro ao carregar clientes e fornecedores:\n" +
          error.message
        );

      }

    }

    async function saveSupplier(ev) {

      ev.preventDefault();


      const razaoSocial =
        $("s_razao_social")
          .value
          .trim();


      const nomeFantasia =
        $("s_nome_fantasia")
          .value
          .trim();


      const cpfCnpj =
        $("s_cpf_cnpj")
          .value
          .trim();


      const contatoResponsavel =
        $("s_contato_responsavel")
          .value
          .trim();


      const email =
        $("s_email")
          .value
          .trim();


      const telefone =
        $("s_telefone")
          .value
          .trim();


      const whatsapp =
        $("s_whatsapp")
          .value
          .trim();


      const cep =
        $("s_cep")
          .value
          .trim();


      const endereco =
        $("s_endereco")
          .value
          .trim();


      const numero =
        $("s_numero")
          .value
          .trim();


      const complemento =
        $("s_complemento")
          .value
          .trim();


      const bairro =
        $("s_bairro")
          .value
          .trim();


      const cidade =
        $("s_cidade")
          .value
          .trim();


      const estado =
        $("s_estado")
          .value
          .trim()
          .toUpperCase();


      const observacoes =
        $("s_observacoes")
          .value
          .trim();


      if (!razaoSocial) {

        alert(
          "Informe a razão social."
        );

        return;

      }


      try {

        const result =
          await db
            .from(
              "gestao_loja_fornecedores"
            )
            .insert({

              id_loja:
                currentStore.id_loja,

              razao_social:
                razaoSocial,

              nome_fantasia:
                nomeFantasia || null,

              cpf_cnpj:
                cpfCnpj || null,

              email:
                email || null,

              telefone:
                telefone || null,

              whatsapp:
                whatsapp || null,

              contato_responsavel:
                contatoResponsavel || null,

              cep:
                cep || null,

              endereco:
                endereco || null,

              numero:
                numero || null,

              complemento:
                complemento || null,

              bairro:
                bairro || null,

              cidade:
                cidade || null,

              estado:
                estado || null,

              observacoes:
                observacoes || null,

              ativo:
                true

            })
            .select(`
              id,
              razao_social,
              nome_fantasia,
              ativo
            `)
            .single();


        if (result.error) {

          throw result.error;

        }


        const newSupplier =
          result.data;


        suppliers.push(
          newSupplier
        );


        suppliers.sort(function(a, b) {

          const nameA =

              String(

              );

          }

        }, 100);

          "Erro ao cadastrar fornecedor:",
          error
        );


        alert(
          "Erro ao cadastrar fornecedor:\n" +
          error.message
        );

      }

    }

    async function saveClient(ev) {

      ev.preventDefault();


      const tipoCliente =
        $("c_tipo_cliente")
          .value;


      const nome =
        $("c_nome")
          .value
          .trim();


      const razaoSocial =
        $("c_razao_social")
          .value
          .trim();


      const nomeFantasia =
        $("c_nome_fantasia")
          .value
          .trim();


      const cpfCnpj =
        $("c_cpf_cnpj")
          .value
          .trim();


      const email =
        $("c_email")
          .value
          .trim();


      const telefone =
        $("c_telefone")
          .value
          .trim();


      const whatsapp =
        $("c_whatsapp")
          .value
          .trim();


      const cep =
        $("c_cep")
          .value
          .trim();


      const endereco =
        $("c_endereco")
          .value
          .trim();


      const numero =
        $("c_numero")
          .value
          .trim();


      const complemento =
        $("c_complemento")
          .value
          .trim();


      const bairro =
        $("c_bairro")
          .value
          .trim();


      const cidade =
        $("c_cidade")
          .value
          .trim();


      const estado =
        $("c_estado")
          .value
          .trim()
          .toUpperCase();


      const observacoes =
        $("c_observacoes")
          .value
          .trim();


      if (!nome) {

        alert(
          "Informe o nome do cliente."
        );

        return;

      }


      try {

        const result =
          await db
            .from(
              "gestao_loja_clientes"
            )
            .insert({

              id_loja:
                currentStore.id_loja,

              tipo_cliente:
                tipoCliente,

              nome:
                nome,

              razao_social:
                razaoSocial || null,

              nome_fantasia:
                nomeFantasia || null,

              cpf_cnpj:
                cpfCnpj || null,

              email:
                email || null,

              telefone:
                telefone || null,

              whatsapp:
                whatsapp || null,

              cep:
                cep || null,

              endereco:
                endereco || null,

              numero:
                numero || null,

              complemento:
                complemento || null,

              bairro:
                bairro || null,

              cidade:
                cidade || null,

              estado:
                estado || null,

              observacoes:
                observacoes || null,

              ativo:
                true

            })
            .select(`
              id,
              nome,
              ativo
            `)
            .single();


        if (result.error) {

          throw result.error;

        }


        const newClient =
          result.data;


        clients.push(
          newClient
        );


        clients.sort(function(a, b) {

          return a.nome.localeCompare(
            b.nome,
            "pt-BR"
          );

        });


        closeModal();


        openMovement();


        setTimeout(function() {

          const clientSelect =
            $("m_cliente");


          if (clientSelect) {

            clientSelect.value =
              String(
                newClient.id
              );

          }

        }, 100);


      } catch (error) {

        console.error(
          "Erro ao cadastrar cliente:",
          error
        );


        alert(
          "Erro ao cadastrar cliente:\n" +
          error.message
        );

      }

    }


    async function saveMovement(ev) {

      ev.preventDefault();


      const itemValue =
        $("m_item").value;


      const type =
        $("m_tipo").value;


      const ajusteTipoElement =
        document.querySelector(
          'input[name="m_ajuste_tipo"]:checked'
        );


      const ajusteTipo =
        ajusteTipoElement
          ? ajusteTipoElement.value
          : "perda";


      const quantity =
        Number(
          $("m_qtd").value
        );


      const motivo =
        $("m_motivo")
          .value
          .trim();


      const observacao =
        $("m_obs")
          .value
          .trim();


      const fornecedorId =
        $("m_fornecedor")
          ? $("m_fornecedor").value
          : "";


      const clienteId =
        $("m_cliente")
          ? $("m_cliente").value
          : "";


      if (!itemValue) {

        alert(
          "Selecione um produto ou variação."
        );

        return;

      }


      if (
        !quantity ||
        quantity <= 0
      ) {

        alert(
          "Informe uma quantidade válida."
        );

        return;

      }


      if (
        type === "Entrada" &&
        !fornecedorId
      ) {

        alert(
          "Selecione o fornecedor."
        );

        return;

      }


      if (
        type === "Saída" &&
        !clienteId
      ) {

        alert(
          "Selecione o cliente."
        );

        return;

      }


      const parts =
        itemValue.split(":");


      const itemType =
        parts[0];


      const itemId =
        parts[1];


      const item =
        stockItems.find(function(x) {

          return x.type === itemType &&
            String(x.id) ===
            String(itemId);

        });


      if (!item) {

        alert(
          "Produto ou variação não encontrado."
        );

        return;

      }


      if (type === "Saída") {

        const estoqueAtual =
          Number(
            item.estoque || 0
          );


        if (
          quantity >
          estoqueAtual
        ) {

          const falta =
            quantity -
            estoqueAtual;


          const continuar =
            confirm(

              "⚠️ ESTOQUE INSUFICIENTE\n\n" +

              "Produto: " +
              item.produto_nome +
              "\n" +

              (
                item.variacao_nome
                  ? "Variação: " +
                    item.variacao_nome +
                    "\n"
                  : ""
              ) +

              "Estoque atual: " +
              estoqueAtual +
              "\n" +

              "Quantidade solicitada: " +
              quantity +
              "\n" +

              "Quantidade faltante: " +
              falta +
              "\n\n" +

              "O estoque ficará negativo.\n\n" +

              "Deseja continuar mesmo assim?"

            );


          if (!continuar) {

            return;

          }

        }

      }


      try {


        if (
          itemType ===
          "variacao"
        ) {


          if (type === "Ajuste") {


            const estoqueAtual =
              Number(
                item.estoque || 0
              );


            const novoEstoque =
              ajusteTipo === "perda"
                ? estoqueAtual - quantity
                : estoqueAtual + quantity;


            const result =
              await db.rpc(
                "gestao_loja_ajustar_estoque",
                {

                  p_variacao_id:
                    itemId,

                  p_novo_estoque:
                    novoEstoque,

                  p_motivo:
                    motivo ||
                    "Ajuste manual"

                }
              );


            if (result.error) {

              throw result.error;

            }


          } else {


            const result =
              await db.rpc(
                "gestao_loja_movimentar_estoque",
                {

                  p_variacao_id:
                    itemId,

                  p_quantidade:
                    quantity,

                  p_entrada:
                    type === "Entrada",

                  p_tipo:
                    type,

                  p_fornecedor_id:
                    type === "Entrada"
                      ? fornecedorId
                      : null,

                  p_cliente_id:
                    type === "Saída"
                      ? clienteId
                      : null,

                  p_motivo:
                    motivo || null,

                  p_observacao:
                    observacao || null

                }
              );


            if (result.error) {

              throw result.error;

            }

          }


        } else {


          let novoEstoque =
            Number(
              item.estoque || 0
            );


          if (
            type ===
            "Entrada"
          ) {

            novoEstoque +=
              quantity;

          } else if (
            type ===
            "Saída"
          ) {

            novoEstoque -=
              quantity;

          } else if (
            type ===
            "Ajuste"
          ) {

            if (ajusteTipo === "perda") {

              novoEstoque -=
                quantity;

            } else {

              novoEstoque +=
                quantity;

            }

          }


          if (
            novoEstoque < 0
          ) {

            const continuar =
              confirm(

                "⚠️ ESTOQUE INSUFICIENTE\n\n" +

                "O estoque ficará negativo.\n\n" +

                "Deseja continuar mesmo assim?"

              );


            if (!continuar) {

              return;

            }

          }


          const result =
            await db
              .from(
                "gestao_loja_produtos"
              )
              .update({

                estoque:
                  novoEstoque

              })
              .eq(
                "id",
                itemId
              )
              .eq(
                "id_loja",
                currentStore.id_loja
              );


          if (result.error) {

            throw result.error;

          }

        }


        closeModal();


        await renderStock();


      } catch (error) {

        console.error(
          "Erro ao movimentar estoque:",
          error
        );


        alert(
          "Erro ao movimentar estoque:\n" +
          error.message
        );

      }

    }

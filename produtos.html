<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestão Loja - Produtos</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</head>

<body data-page="produtos">

  <div id="app" class="app">

    <div id="menu"></div>

    <main class="main">

      <div class="topbar">

        <div>
          <h1>Produtos</h1>
          <div
            class="muted"
            id="pageSubtitle">
          </div>
        </div>

        <div class="user-info">

          <br>

          <span id="userEmail"></span>

        </div>

      </div>

      <div id="content">

        <div class="section">

          <div class="section-head">

            <h2>Produtos cadastrados</h2>

            <button
              class="btn btn-primary"
              onclick="newProduct()">
              + Novo produto
            </button>

          </div>

          <div
            id="productsTable"
            class="loading">
            Carregando...
          </div>

        </div>

      </div>

    </main>

  </div>

  <div
    id="modal"
    class="modal hidden">

    <div class="modal-card">

      <div class="modal-head">

        <h2 id="modalTitle">
          Cadastro
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div id="modalContent"></div>

    </div>

  </div>

  <script>

    let products = [];
    let categories = [];

    /*
     * Gera um SKU único no formato:
     *   SKU-YYYYMMDDHHMMSS-XXX
     * Ex.: SKU-20251008143022-472
     */
    function generateSku() {
      const now = new Date();

      const y = now.getFullYear();

      const m = String(
        now.getMonth() + 1
      ).padStart(2, "0");

      const d = String(
        now.getDate()
      ).padStart(2, "0");

      const h = String(
        now.getHours()
      ).padStart(2, "0");

      const mi = String(
        now.getMinutes()
      ).padStart(2, "0");

      const s = String(
        now.getSeconds()
      ).padStart(2, "0");

      const random = String(
        Math.floor(Math.random() * 1000)
      ).padStart(3, "0");

      return (
        "SKU-" +
        y + m + d + h + mi + s +
        "-" +
        random
      );
    }

    async function loadCategories() {

      const result = await db
        .from("gestao_loja_categorias")
        .select("id,nome")
        .order("nome");

      if (result.error) {
        throw result.error;
      }

      categories = result.data || [];
    }

    async function loadProducts() {

      const result = await db
        .from("gestao_loja_produtos")
        .select(`
          id,
          id_loja,
          nome,
          sku,
          descricao,
          imagem_principal,
          categoria_id,
          unidade_medida,
          preco_custo,
          preco_venda,
          estoque_minimo,
          ativo,
          exibir_catalogo,
          exibir_preco_catalogo,
          observacoes,
          ncm,
          cfop,
          cest,
          unidade,
          origem_mercadoria,
          created_at,
          atualizado_em
        `)
        .eq("id_loja", currentStore.id_loja)
        .order("nome");

      if (result.error) {
        throw result.error;
      }

      products = result.data || [];
    }

    async function renderProducts() {

      try {

        await loadProducts();

      } catch (e) {

        $("productsTable").innerHTML =
          '<div class="message error">' +
          escapeHtml(e.message) +
          '</div>';

        return;
      }

      if (!products.length) {

        $("productsTable").innerHTML =
          '<div class="empty">' +
          'Nenhum produto cadastrado.' +
          '</div>';

        return;
      }

      $("productsTable").innerHTML = `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Produto</th>

                <th>SKU</th>

                <th>Categoria</th>

                <th>Unidade</th>

                <th>NCM</th>

                <th>Preço</th>

                <th>Status</th>

                <th></th>

              </tr>

            </thead>

            <tbody>

              ${products.map(function(p) {

                const categoria =
                  categories.find(function(c) {
                    return String(c.id) ===
                      String(p.categoria_id);
                  });

                return `

                  <tr>

                    <td>

                      <strong>
                        ${escapeHtml(p.nome)}
                      </strong>

                    </td>

                    <td>

                      <strong>
                        ${escapeHtml(
                          p.sku || "-"
                        )}
                      </strong>

                    </td>

                    <td>

                      ${
                        categoria
                          ? escapeHtml(
                              categoria.nome
                            )
                          : "-"
                      }

                    </td>

                    <td>

                      ${escapeHtml(
                        p.unidade_medida || "UN"
                      )}

                    </td>

                    <td>

                      ${
                        p.ncm
                          ? escapeHtml(p.ncm)
                          : '<span class="muted">—</span>'
                      }

                    </td>

                    <td>

                      ${money(
                        p.preco_venda
                      )}

                    </td>

                    <td>

                      <span
                        class="badge ${
                          p.ativo
                            ? "badge-green"
                            : "badge-red"
                        }">

                        ${
                          p.ativo
                            ? "Ativo"
                            : "Inativo"
                        }

                      </span>

                    </td>

                    <td>

                      <button
                        class="btn btn-secondary"
                        onclick="editProduct('${p.id}')">

                        Editar

                      </button>

                    </td>

                  </tr>

                `;

              }).join("")}

            </tbody>

          </table>

        </div>

      `;

    }

    function productForm(p = {}) {

      const categoryOptions =
        categories.map(function(c) {

          return `

            <option
              value="${c.id}"
              ${
                String(
                  p.categoria_id || ""
                ) === String(c.id)
                  ? "selected"
                  : ""
              }>

              ${escapeHtml(c.nome)}

            </option>

          `;

        }).join("");

      return `

        <form
          onsubmit="saveProduct(
            event,
            ${
              p.id
                ? `'${p.id}'`
                : "null"
            }
          )">

          <div>

            <label>SKU</label>

            <input
              id="p_sku"
              value="${escapeHtml(
                p.sku ||
                "Gerado automaticamente"
              )}"
              readonly>

            <small class="muted">

              O SKU é gerado automaticamente
              pelo sistema.

            </small>

          </div>

          <div class="grid2">

            <div>

              <label>
                Nome *
              </label>

              <input
                id="p_nome"
                required
                value="${escapeHtml(
                  p.nome || ""
                )}">

            </div>

            <div>

              <label>
                Categoria
              </label>

              <select id="p_categoria">

                <option value="">
                  Sem categoria
                </option>

                ${categoryOptions}

              </select>

            </div>

          </div>

          <div>

            <label>
              Descrição
            </label>

            <textarea
              id="p_descricao"
              rows="3"
            >${escapeHtml(
              p.descricao || ""
            )}</textarea>

          </div>

          <div class="grid2">

            <div>

              <label>
                Unidade de medida
              </label>

              <input
                id="p_unidade"
                value="${escapeHtml(
                  p.unidade_medida || "UN"
                )}">

            </div>

            <div>

              <label>
                Preço de venda
              </label>

              <input
                id="p_preco"
                type="number"
                step="0.01"
                min="0"
                value="${
                  p.preco_venda ?? 0
                }">

            </div>

          </div>

          <div class="grid2">

            <div>

              <label>
                Preço de custo
              </label>

              <input
                id="p_custo"
                type="number"
                step="0.01"
                min="0"
                value="${
                  p.preco_custo ?? 0
                }">

            </div>

            <div>

              <label>
                Estoque mínimo
              </label>

              <input
                id="p_minimo"
                type="number"
                step="0.001"
                min="0"
                value="${
                  p.estoque_minimo ?? 0
                }">

            </div>

          </div>

          <!-- ===== DADOS FISCAIS (NF-e) ===== -->

          <div
            style="
              margin-top:20px;
              padding-top:15px;
              border-top:1px solid #ddd;
            "
          >

            <strong>
              Dados fiscais (NF-e)
            </strong>

            <div
              class="muted"
              style="
                font-size:12px;
                margin-top:4px;
                margin-bottom:12px;
              "
            >
              Usados na emissão de NF-e.
              NCM é obrigatório para PJ.
            </div>

            <div class="grid2">

              <div>

                <label>NCM</label>

                <input
                  id="p_ncm"
                  maxlength="8"
                  placeholder="00000000"
                  value="${escapeHtml(
                    p.ncm || ""
                  )}"
                  oninput="this.value = this.value.replace(/\D/g, '').slice(0,8)">

                <small class="muted">
                  8 dígitos, sem pontos
                </small>

              </div>

              <div>

                <label>CFOP</label>

                <input
                  id="p_cfop"
                  maxlength="4"
                  placeholder="5102"
                  value="${escapeHtml(
                    p.cfop || "5102"
                  )}"
                  oninput="this.value = this.value.replace(/\D/g, '').slice(0,4)">

              </div>

            </div>

            <div class="grid2">

              <div>

                <label>CEST</label>

                <input
                  id="p_cest"
                  maxlength="7"
                  placeholder="0000000"
                  value="${escapeHtml(
                    p.cest || ""
                  )}"
                  oninput="this.value = this.value.replace(/\D/g, '').slice(0,7)">

                <small class="muted">
                  Opcional (substituição tributária)
                </small>

              </div>

              <div>

                <label>Unidade fiscal</label>

                <select id="p_unidade_fiscal">

                  <option value="UN" ${
                    (p.unidade || "UN") === "UN"
                      ? "selected"
                      : ""
                  }>UN - Unidade</option>

                  <option value="PC" ${
                    p.unidade === "PC"
                      ? "selected"
                      : ""
                  }>PC - Peça</option>

                  <option value="CX" ${
                    p.unidade === "CX"
                      ? "selected"
                      : ""
                  }>CX - Caixa</option>

                  <option value="KG" ${
                    p.unidade === "KG"
                      ? "selected"
                      : ""
                  }>KG - Quilograma</option>

                  <option value="G" ${
                    p.unidade === "G"
                      ? "selected"
                      : ""
                  }>G - Grama</option>

                  <option value="L" ${
                    p.unidade === "L"
                      ? "selected"
                      : ""
                  }>L - Litro</option>

                  <option value="ML" ${
                    p.unidade === "ML"
                      ? "selected"
                      : ""
                  }>ML - Mililitro</option>

                  <option value="M" ${
                    p.unidade === "M"
                      ? "selected"
                      : ""
                  }>M - Metro</option>

                  <option value="M2" ${
                    p.unidade === "M2"
                      ? "selected"
                      : ""
                  }>M2 - Metro quadrado</option>

                  <option value="M3" ${
                    p.unidade === "M3"
                      ? "selected"
                      : ""
                  }>M3 - Metro cúbico</option>

                  <option value="PAR" ${
                    p.unidade === "PAR"
                      ? "selected"
                      : ""
                  }>PAR - Par</option>

                  <option value="DZ" ${
                    p.unidade === "DZ"
                      ? "selected"
                      : ""
                  }>DZ - Dúzia</option>

                </select>

              </div>

            </div>

            <div>

              <label>Origem da mercadoria</label>

              <select id="p_origem_mercadoria">

                <option value="0" ${
                  (p.origem_mercadoria || "0") === "0"
                    ? "selected"
                    : ""
                }>0 - Nacional</option>

                <option value="1" ${
                  p.origem_mercadoria === "1"
                    ? "selected"
                    : ""
                }>1 - Estrangeira (importação direta)</option>

                <option value="2" ${
                  p.origem_mercadoria === "2"
                    ? "selected"
                    : ""
                }>2 - Estrangeira (mercado interno)</option>

                <option value="3" ${
                  p.origem_mercadoria === "3"
                    ? "selected"
                    : ""
                }>3 - Nacional c/ importação 40%–70%</option>

                <option value="4" ${
                  p.origem_mercadoria === "4"
                    ? "selected"
                    : ""
                }>4 - Nacional (processos produtivos básicos)</option>

                <option value="5" ${
                  p.origem_mercadoria === "5"
                    ? "selected"
                    : ""
                }>5 - Nacional c/ importação ≤ 40%</option>

                <option value="6" ${
                  p.origem_mercadoria === "6"
                    ? "selected"
                    : ""
                }>6 - Estrangeira (sem similar nacional)</option>

                <option value="7" ${
                  p.origem_mercadoria === "7"
                    ? "selected"
                    : ""
                }>7 - Estrangeira (mercado interno, sem similar)</option>

                <option value="8" ${
                  p.origem_mercadoria === "8"
                    ? "selected"
                    : ""
                }>8 - Nacional c/ importação > 70%</option>

              </select>

            </div>

          </div>

          <!-- ===== FIM DADOS FISCAIS ===== -->

          <label>

            <input
              id="p_ativo"
              type="checkbox"
              style="width:auto"
              ${
                p.ativo !== false
                  ? "checked"
                  : ""
              }>

            Produto ativo

          </label>

          <label>

            <input
              id="p_catalogo"
              type="checkbox"
              style="width:auto"
              ${
                p.exibir_catalogo !== false
                  ? "checked"
                  : ""
              }>

            Exibir no catálogo

          </label>

          <label>

            <input
              id="p_preco_catalogo"
              type="checkbox"
              style="width:auto"
              ${
                p.exibir_preco_catalogo !== false
                  ? "checked"
                  : ""
              }>

            Exibir preço no catálogo

          </label>

          <div>

            <label>
              Observações
            </label>

            <textarea
              id="p_observacoes"
              rows="3"
            >${escapeHtml(
              p.observacoes || ""
            )}</textarea>

          </div>

          <button
            class="btn btn-primary full"
            type="submit">

            Salvar produto

          </button>

        </form>

      `;

    }

    function newProduct() {

      openModal(
        "Novo produto",
        productForm({
          ativo: true,
          exibir_catalogo: true,
          exibir_preco_catalogo: true,
          cfop: "5102",
          unidade: "UN",
          origem_mercadoria: "0"
        })
      );

    }

    function editProduct(id) {

      const p =
        products.find(function(x) {

          return String(x.id) ===
            String(id);

        });

      if (!p) {

        alert(
          "Produto não encontrado."
        );

        return;
      }

      openModal(
        "Editar produto",
        productForm(p)
      );

    }

    async function saveProduct(ev, id) {

      ev.preventDefault();

      if (!currentStore) {

        alert(
          "Não foi possível identificar a loja."
        );

        return;
      }

      const skuInput =
        $("p_sku");

      /*
       * Em edição: reaproveita o SKU atual.
       * Em cadastro novo: gera um SKU novo.
       */
      let sku;

      if (id) {

        sku =
          skuInput &&
          skuInput.value &&
          skuInput.value !==
            "Gerado automaticamente"
            ? skuInput.value.trim()
            : generateSku();

      } else {

        sku = generateSku();

      }

      /* ===== Validação do NCM ===== */

      const ncmValue =
        $("p_ncm")
          .value
          .replace(/\D/g, "");

      if (
        ncmValue &&
        ncmValue.length !== 8
      ) {

        alert(
          "O NCM deve ter exatamente 8 dígitos.\n\n" +
          "Valor informado: " +
          (ncmValue || "(vazio)")
        );

        return;
      }

      /* ===== Fim da validação ===== */

      const payload = {

        id_loja:
          currentStore.id_loja,

        sku:
          sku,

        nome:
          $("p_nome")
            .value
            .trim(),

        categoria_id:
          $("p_categoria")
            .value
            ? Number(
                $("p_categoria").value
              )
            : null,

        descricao:
          $("p_descricao")
            .value
            .trim() || null,

        unidade_medida:
          $("p_unidade")
            .value
            .trim() || "UN",

        preco_venda:
          Number(
            $("p_preco").value || 0
          ),

        preco_custo:
          Number(
            $("p_custo").value || 0
          ),

        estoque_minimo:
          Number(
            $("p_minimo").value || 0
          ),

        /* ===== Dados fiscais ===== */

        ncm:
          ncmValue || null,

        cfop:
          $("p_cfop")
            .value
            .replace(/\D/g, "") || "5102",

        cest:
          $("p_cest")
            .value
            .replace(/\D/g, "") || null,

        unidade:
          $("p_unidade_fiscal")
            .value || "UN",

        origem_mercadoria:
          $("p_origem_mercadoria")
            .value || "0",

        /* ===== Fim dados fiscais ===== */

        ativo:
          $("p_ativo").checked,

        exibir_catalogo:
          $("p_catalogo").checked,

        exibir_preco_catalogo:
          $("p_preco_catalogo").checked,

        observacoes:
          $("p_observacoes")
            .value
            .trim() || null

      };

      console.log(
        "Salvando produto:",
        payload
      );

      let result;

      if (id) {

        result = await db
          .from("gestao_loja_produtos")
          .update(payload)
          .eq("id", id)
          .eq(
            "id_loja",
            currentStore.id_loja
          );

      } else {

        result = await db
          .from("gestao_loja_produtos")
          .insert(payload);

      }

      if (result.error) {

        console.error(
          "Erro ao salvar produto:",
          result.error
        );

        alert(
          "Erro ao salvar produto:\n\n" +
          (result.error.message ||
            "Erro desconhecido.")
        );

        return;
      }

      closeModal();

      await renderProducts();

    }

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        const authenticated =
          await requireAuth();

        if (!authenticated) {
          return;
        }

        const contextLoaded =
          await loadUserContext();

        if (!contextLoaded) {
          return;
        }

        setActiveNav();

        $("pageSubtitle").textContent =
          "Cadastre e gerencie seus produtos";

        try {

          await loadCategories();

          await renderProducts();

        } catch (e) {

          console.error(e);

          $("productsTable").innerHTML =
            '<div class="message error">' +
            escapeHtml(e.message) +
            '</div>';

        }

      }
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar nova loja • Gestão Loja</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .signup-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 20%, rgba(79, 70, 229, .20), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(37, 99, 235, .18), transparent 30%),
        linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #eff6ff 100%);
    }

    .signup-card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 24px;
      padding: 42px 38px;
      box-shadow:
        0 25px 60px rgba(15, 23, 42, .12),
        0 8px 25px rgba(15, 23, 42, .06);
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 12px 25px rgba(79, 70, 229, .28);
    }

    .signup-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .signup-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 9px;
    }

    .signup-header p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      border: 1px solid #dbe2ea;
      border-radius: 13px;
      background: #f8fafc;
      color: #111827;
      font-size: 14px;
      padding: 0 16px;
      outline: none;
      transition: .2s ease;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, .10);
    }

    .btn-primary {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      margin-top: 8px;
      cursor: pointer;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 10px 22px rgba(79, 70, 229, .25);
      transition: .2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(79, 70, 229, .32);
    }

    .btn-primary:disabled {
      cursor: not-allowed;
      opacity: .7;
      transform: none;
    }

    .message {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .message.error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .message.success {
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .message.info {
      color: #1e40af;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .hidden { display: none !important; }

    .footer-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
    }

    .footer-link:hover { color: #2563eb; }
  </style>
</head>

<body>

  <div class="signup-page">
    <div class="signup-card">

      <div class="brand">
        <div class="brand-icon">GL</div>
      </div>

      <div class="signup-header">
        <h1>Criar nova loja</h1>
        <p id="signupSubtitle">Validando convite...</p>
      </div>

      <div id="signupMessage"></div>

      <!-- Formulário (só aparece após validação) -->
      <form id="signupForm" class="hidden">
        <div class="form-group">
          <label for="storeName">Nome da loja</label>
          <input type="text" id="storeName" placeholder="Ex.: Loja Centro" required>
        </div>

        <div class="form-group">
          <label for="storeCnpj">CNPJ</label>
          <input type="text" id="storeCnpj" placeholder="00.000.000/0000-00">
        </div>

        <div class="form-group">
          <label for="storePhone">Telefone</label>
          <input type="text" id="storePhone" placeholder="(11) 99999-9999">
        </div>

        <div class="form-group">
          <label for="adminName">Seu nome (administrador)</label>
          <input type="text" id="adminName" placeholder="Nome completo" required>
        </div>

        <div class="form-group">
          <label for="adminEmail">Seu e-mail</label>
          <input type="email" id="adminEmail" placeholder="voce@email.com" required>
        </div>

        <div class="form-group">
          <label for="adminPassword">Senha</label>
          <input type="password" id="adminPassword" placeholder="Mínimo 6 caracteres" required>
        </div>

        <button type="submit" class="btn-primary" id="signupSubmit">
          Criar loja
        </button>
      </form>

      <a href="index.html" class="footer-link">← Voltar para o login</a>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    (async function validarConviteNoCadastro() {
      const message   = document.getElementById("signupMessage");
      const subtitle  = document.getElementById("signupSubtitle");
      const form      = document.getElementById("signupForm");

      function showMessage(text, type) {
        message.innerHTML =
          '<div class="message ' + (type || "info") + '">' +
          text +
          "</div>";
      }

      // 1) Lê o token da URL
      const token = new URLSearchParams(location.search).get("token");

      if (!token) {
        subtitle.textContent = "Nenhum convite informado.";
        showMessage("Esta página precisa de um convite válido.", "error");
        return;
      }

      // 2) Aguarda window.db (criado pelo app.js)
      let tentativas = 0;
      while (!window.db && tentativas < 20) {
        await new Promise(r => setTimeout(r, 150));
        tentativas++;
      }

      if (!window.db) {
        subtitle.textContent = "Erro de conexão.";
        showMessage("Não foi possível conectar ao servidor.", "error");
        return;
      }

      // 3) Valida o convite
      try {
        const { data, error } = await window.db.rpc("validar_convite", {
          p_token: token
        });

        if (error) {
          subtitle.textContent = "Erro ao validar convite.";
          showMessage("Erro: " + (error.message || "desconhecido"), "error");
          return;
        }

        if (!data || !data.valido) {
          subtitle.textContent = "Convite inválido.";
          const motivo = data && data.motivo ? data.motivo : "desconhecido";
          const mensagens = {
            nao_encontrado: "Convite não encontrado.",
            inativo: "Este convite foi desativado.",
            ja_usado: "Este convite já foi utilizado.",
            expirado: "Este convite expirou."
          };
          showMessage(mensagens[motivo] || "Convite inválido.", "error");
          return;
        }

        // 4) Convite válido → mostra o formulário
        subtitle.textContent = "Preencha os dados da nova loja.";

        if (data.expira_em) {
          const expira = new Date(data.expira_em);
          showMessage(
            "Convite válido até " +
            expira.toLocaleString("pt-BR", {
              dateStyle: "short",
              timeStyle: "short"
            }),
            "success"
          );
        }

        form.classList.remove("hidden");

      } catch (e) {
        console.error("Erro ao validar convite:", e);
        subtitle.textContent = "Erro inesperado.";
        showMessage("Erro inesperado ao validar convite.", "error");
      }
    })();

    // Submit do formulário (placeholder — adapte para sua lógica de criação)
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("signupForm");
      if (!form) return;

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const token = new URLSearchParams(location.search).get("token");
        const submit = document.getElementById("signupSubmit");
        const message = document.getElementById("signupMessage");

        if (submit) {
          submit.disabled = true;
          submit.textContent = "Criando...";
        }

        try {
          const storeName = document.getElementById("storeName").value.trim();
          const cnpj      = document.getElementById("storeCnpj").value.trim();
          const phone     = document.getElementById("storePhone").value.trim();
          const adminName = document.getElementById("adminName").value.trim();
          const adminEmail = document.getElementById("adminEmail").value.trim();
          const adminPassword = document.getElementById("adminPassword").value;

          // ⚠️ ADAPTE: chame aqui a função/Edge Function que cria a loja
          // Exemplo (se existir RPC no banco):
          // const { data, error } = await window.db.rpc("criar_loja_com_convite", {
          //   p_token: token,
          //   p_nome: storeName,
          //   p_cnpj: cnpj,
          //   p_telefone: phone,
          //   p_admin_nome: adminName,
          //   p_admin_email: adminEmail,
          //   p_admin_senha: adminPassword
          // });
          //
          // if (error || !data || !data.ok) {
          //   throw new Error(error?.message || data?.erro || "Erro ao criar loja.");
          // }

          console.log("Dados prontos para envio:", {
            token, storeName, cnpj, phone, adminName, adminEmail
          });

          if (message) {
            message.innerHTML =
              '<div class="message success">Loja criada com sucesso! Redirecionando...</div>';
          }

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);

        } catch (err) {
          console.error("Erro ao criar loja:", err);
          if (message) {
            message.innerHTML =
              '<div class="message error">' +
              (err.message || "Erro ao criar loja.") +
              "</div>";
          }
        } finally {
          if (submit) {
            submit.disabled = false;
            submit.textContent = "Criar loja";
          }
        }
      });
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convites de cadastro — Gestão Loja</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .conv-page { max-width: 900px; margin: 0 auto; padding: 30px 20px; }

    .conv-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
      margin-bottom: 20px;
    }

    .conv-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .conv-sub {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .conv-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
    }

    .conv-btn:disabled { opacity: .6; cursor: not-allowed; }

    .conv-btn-small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .conv-btn-danger {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .conv-btn-danger:hover {
      background: #fee2e2;
    }

    .conv-btn-copy {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .conv-btn-copy:hover {
      background: #dbeafe;
    }

    .conv-link-box {
      margin-top: 18px;
      padding: 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      font-size: 13px;
      color: #166534;
      word-break: break-all;
      display: none;
    }

    .conv-link-box.visible { display: block; }

    .conv-link-url {
      font-family: monospace;
      font-size: 12px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      word-break: break-all;
    }

    .conv-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .conv-table th,
    .conv-table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      text-align: left;
      vertical-align: middle;
    }

    .conv-table th {
      font-weight: 700;
      color: #555;
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-ativo { background: #f0fdf4; color: #166534; }
    .badge-usado { background: #e5e7eb; color: #6b7280; }
    .badge-expirado { background: #fef2f2; color: #b91c1c; }
    .badge-revogado { background: #fef3c7; color: #92400e; }

    .msg {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 14px;
    }

    .msg.error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
    .msg.success { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }

    .token-cell {
      font-family: monospace;
      font-size: 11px;
      color: #555;
    }

    .action-cell {
      white-space: nowrap;
    }

    .action-cell .conv-btn {
      margin-right: 6px;
    }

    .action-cell .conv-btn:last-child {
      margin-right: 0;
    }
  </style>
</head>

<body data-page="convites">

  <div id="app" class="app">

    <div id="menu"></div>

    <main class="main">

      <div class="topbar">
        <div>
          <h1>Convites de cadastro</h1>
          <div class="muted" id="pageSubtitle"></div>
        </div>

        <div class="user-info">
          <br>
          <span id="userEmail"></span>
        </div>
      </div>

      <div id="content" class="conv-page">

        <div class="conv-card">
          <div class="conv-title">Novo convite</div>
          <div class="conv-sub">
            Gere links de cadastro de uso único (válidos por 1 dia).
            Apenas a loja matriz (loja 1) tem acesso a esta página.
          </div>

          <button class="conv-btn" id="btnGerar">
            + Gerar novo convite
          </button>

          <div class="conv-link-box" id="linkBox">
            <strong>Link gerado (válido por 24h):</strong>
            <div class="conv-link-url" id="linkUrl"></div>
            <div style="margin-top:10px;">
              <button
                class="conv-btn conv-btn-small"
                onclick="copiarLinkRecente()"
              >
                📋 Copiar link
              </button>
            </div>
          </div>

          <div id="convMsg"></div>
        </div>

        <div class="conv-card">
          <div class="conv-title" style="font-size:16px;">Histórico de convites</div>
          <div class="conv-sub" style="margin-bottom:10px;">
            Convites ativos podem ser copiados mesmo após recarregar a página.
          </div>

          <div id="convLista">Carregando...</div>
        </div>

      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    (function () {
      let userCtx = null;
      let linkGerado = "";

      const msgEl = document.getElementById("convMsg");
      const btnGerar = document.getElementById("btnGerar");
      const linkBox = document.getElementById("linkBox");
      const linkUrl = document.getElementById("linkUrl");
      const lista = document.getElementById("convLista");

      function msg(text, type) {
        msgEl.textContent = text || "";
        msgEl.className = "msg " + (type || "");
      }

      function gerarToken() {
        const arr = new Uint8Array(24);
        crypto.getRandomValues(arr);
        return Array.from(arr)
          .map(function (b) {
            return b.toString(16).padStart(2, "0");
          })
          .join("");
      }

      /*
       * Monta a URL completa do link de cadastro a partir do token.
       * Usa o mesmo origin/path da página atual (convites.html),
       * trocando apenas o nome do arquivo para login.html.
       */
      function montarUrlCadastro(token) {
        return (
          window.location.origin +
          window.location.pathname.replace(/[^/]*$/, "") +
          "index.html?token=" +
          encodeURIComponent(token)
        );
      }

      async function copiarTexto(texto) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(texto);
            return true;
          }
        } catch (e) {
          console.warn("Clipboard API falhou, usando fallback:", e);
        }

        // Fallback para navegadores antigos / contextos não seguros
        try {
          const ta = document.createElement("textarea");
          ta.value = texto;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (e) {
          console.error("Fallback de cópia falhou:", e);
          return false;
        }
      }

      async function init() {
        // app.js carrega o menu e o contexto; se ainda não carregou, espera
        if (!window.db || !window.currentStore) {
          return setTimeout(init, 300);
        }

        // app.js já garantiu o login (requireAuth + loadUserContext)
        const { data: { user } } = await db.auth.getUser();

        if (!user) {
          document.body.innerHTML =
            "<div style='padding:40px;text-align:center;'>Faça login primeiro.</div>";
          return;
        }

        // Verifica se é da loja 1
        const { data: vinculos, error } = await db
          .from("gestao_loja_usuarios")
          .select("id_loja")
          .eq("id", user.id)
          .limit(1);

        if (error || !vinculos || !vinculos.length) {
          document.body.innerHTML =
            "<div style='padding:40px;text-align:center;'>Sem vínculo com loja.</div>";
          return;
        }

        if (Number(vinculos[0].id_loja) !== 1) {
          document.body.innerHTML =
            "<div style='padding:40px;text-align:center;'>Acesso restrito à loja matriz.</div>";
          return;
        }

        userCtx = { id: user.id, id_loja: vinculos[0].id_loja };

        const subtitle = document.getElementById("pageSubtitle");
        if (subtitle) {
          subtitle.textContent =
            "Links de cadastro de uso único, válidos por 24h";
        }

        carregarLista();
      }

      async function carregarLista() {
        const { data, error } = await db
          .from("gestao_loja_convites")
          .select("*")
          .order("criado_em", { ascending: false })
          .limit(30);

        if (error) {
          lista.innerHTML =
            "<div class='msg error'>Erro: " + error.message + "</div>";
          return;
        }

        if (!data || !data.length) {
          lista.innerHTML =
            "<div style='color:#888;padding:20px;text-align:center;'>Nenhum convite gerado.</div>";
          return;
        }

        const agora = new Date();

        lista.innerHTML =
          "<table class='conv-table'><thead><tr>" +
          "<th>Token</th><th>Criado em</th><th>Expira em</th><th>Status</th><th>Ações</th>" +
          "</tr></thead><tbody>" +
          data.map(function (c) {
            const expirado = new Date(c.expira_em) <= agora;
            const usado = !!c.usado_em;
            const revogado = c.ativo === false && !usado;
            const ativo = !usado && !expirado && !revogado;

            let status = "<span class='badge badge-ativo'>Ativo</span>";

            if (usado) {
              status = "<span class='badge badge-usado'>Usado</span>";
            } else if (expirado) {
              status = "<span class='badge badge-expirado'>Expirado</span>";
            } else if (revogado) {
              status = "<span class='badge badge-revogado'>Revogado</span>";
            }

            // =========================================================
            // AÇÕES: copiar (se ativo) + revogar (se ativo)
            // =========================================================
            const acoes = [];

            if (ativo) {
              acoes.push(
                `<button
                   class="conv-btn conv-btn-small conv-btn-copy"
                   onclick="copiarConvite('${c.token.replace(/'/g, "\\'")}')"
                   title="Copiar link de cadastro"
                 >
                   📋 Copiar
                 </button>`
              );

              acoes.push(
                `<button
                   class="conv-btn conv-btn-small conv-btn-danger"
                   onclick="revogarConvite(${c.id})"
                   title="Revogar este convite"
                 >
                   Revogar
                 </button>`
              );
            }

            const acaoHtml = acoes.length
              ? acoes.join("")
              : "<span style='color:#cbd5e1;'>—</span>";

            return (
              "<tr>" +
              "<td class='token-cell'>" +
              c.token.substring(0, 16) + "…" +
              "</td>" +
              "<td>" + new Date(c.criado_em).toLocaleString("pt-BR") + "</td>" +
              "<td>" + new Date(c.expira_em).toLocaleString("pt-BR") + "</td>" +
              "<td>" + status + "</td>" +
              "<td class='action-cell'>" + acaoHtml + "</td>" +
              "</tr>"
            );
          }).join("") +
          "</tbody></table>";
      }

      btnGerar.addEventListener("click", async function () {
        if (!userCtx) return;

        btnGerar.disabled = true;
        btnGerar.textContent = "Gerando...";
        msg("");

        try {
          const token = gerarToken();
          const expira = new Date(Date.now() + 24 * 60 * 60 * 1000);

          const { error } = await db
            .from("gestao_loja_convites")
            .insert({
              token: token,
              criado_por: userCtx.id,
              expira_em: expira.toISOString(),
              ativo: true
            });

          if (error) throw error;

          linkGerado = montarUrlCadastro(token);
          linkUrl.textContent = linkGerado;
          linkBox.classList.add("visible");

          msg("Convite gerado com sucesso!", "success");

          carregarLista();
        } catch (e) {
          console.error(e);
          msg(e.message || "Erro ao gerar convite.", "error");
        } finally {
          btnGerar.disabled = false;
          btnGerar.textContent = "+ Gerar novo convite";
        }
      });

      /*
       * Copia o link do convite recém-gerado (linkBox).
       */
      window.copiarLinkRecente = async function () {
        if (!linkGerado) return;

        const ok = await copiarTexto(linkGerado);

        if (ok) {
          msg("Link copiado para a área de transferência!", "success");
        } else {
          msg("Não foi possível copiar. Copie manualmente.", "error");
        }
      };

      /*
       * Copia o link de um convite da tabela (por token).
       * Funciona após recarregar a página.
       */
      window.copiarConvite = async function (token) {
        if (!token) return;

        const url = montarUrlCadastro(token);
        const ok = await copiarTexto(url);

        if (ok) {
          msg("Link copiado para a área de transferência!", "success");
        } else {
          msg("Não foi possível copiar. Copie manualmente.", "error");
        }
      };

      window.revogarConvite = async function (id) {
        const confirmado = confirm(
          "Revogar este convite?\n\nO link deixará de funcionar imediatamente."
        );

        if (!confirmado) return;

        try {
          const { error } = await db
            .from("gestao_loja_convites")
            .update({ ativo: false })
            .eq("id", id);

          if (error) throw error;

          msg("Convite revogado com sucesso.", "success");

          carregarLista();
        } catch (e) {
          console.error(e);
          msg(e.message || "Erro ao revogar convite.", "error");
        }
      };

      init();
    })();
  </script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="catalogo.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .catalog-app {
      min-height: 100vh;
      width: 100%;
      background: #ffffff;
    }

    .catalog-main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 50px;
    }

    .catalog-header {
      width: 100%;
      padding: 25px 0 18px;
      text-align: center;
      border-bottom: 1px solid #eeeeee;
    }

    .catalog-store-name {
      font-size: 28px !important;
      font-weight: 800;
      line-height: 1.2;
      color: #222222;
      margin: 0;
    }

    .catalog-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #888888;
    }

    .catalog-navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      padding: 14px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .catalog-navigation a {
      color: #333333;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .catalog-navigation a:hover {
      color: #888888;
    }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 22px 0;
    }

    .catalog-search-box {
      flex: 1;
    }

    #catalogSearch {
      width: 100% !important;
      height: 42px !important;
      padding: 0 14px !important;
      border: 1px solid #dddddd !important;
      border-radius: 5px !important;
      outline: none !important;
      background: #ffffff !important;
      font-size: 13px !important;
    }

    #catalogSearch:focus {
      border-color: #999999 !important;
    }

    .catalog-cart-button {
      height: 42px;
      border: 0;
      border-radius: 5px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .catalog-cart-button:hover {
      background: #000000;
    }

    .catalog-cart-button b {
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      color: #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .catalog-products {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .catalog-product {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      height: auto !important;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
      transition: .2s ease;
    }

    .catalog-product:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
    }

    .catalog-product > .catalog-product-image {
      width: 100% !important;
      height: 160px !important;
      max-height: 160px !important;
      min-height: 160px !important;
      display: block !important;
      object-fit: contain !important;
      background: #f7f7f7;
    }

    .catalog-product-no-image {
      width: 100% !important;
      height: 160px !important;
      max-height: 160px !important;
      min-height: 160px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #999999;
      font-size: 12px;
    }

    .catalog-product-body {
      width: 100%;
      padding: 12px;
    }

    .catalog-product-name {
      font-size: 14px;
      font-weight: 700;
      color: #222222;
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .catalog-product-description {
      color: #777777;
      font-size: 11px;
      line-height: 1.4;
      height: 31px;
      overflow: hidden;
      margin-bottom: 9px;
    }

    .catalog-product-price {
      color: #222222;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .catalog-product-action {
      width: 100%;
      height: 36px;
      border: 0;
      border-radius: 4px;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .catalog-product-action:hover {
      background: #000000;
    }

    .catalog-loading,
    .catalog-empty {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #777777;
      border: 1px solid #eeeeee;
      font-size: 13px;
    }

    .catalog-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 15px;
      background: rgba(0, 0, 0, .65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .catalog-modal.hidden {
      display: none !important;
    }

    .catalog-modal-card {
      width: 100%;
      max-width: 780px;
      max-height: 92vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 7px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    .catalog-modal-head {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
    }

    .catalog-modal-head h2 {
      margin: 0;
      font-size: 18px;
      color: #222222;
    }

    .catalog-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f1f1f1;
      color: #333333;
      font-size: 22px;
      cursor: pointer;
    }

    .catalog-close:hover {
      background: #222222;
      color: #ffffff;
    }

    .catalog-product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      padding: 22px;
    }

    .catalog-product-detail > .catalog-product-image {
      width: 100% !important;
      height: 300px !important;
      max-height: 300px !important;
      min-height: 300px !important;
      background: #f7f7f7;
      overflow: hidden;
      object-fit: contain !important;
    }

    .catalog-product-detail > .catalog-product-image img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
    }

    .catalog-product-info {
      width: 100%;
    }

    .catalog-product-info h2 {
      margin: 0 0 12px;
      font-size: 23px;
      color: #222222;
    }

    .catalog-product-info .muted {
      color: #777777;
      font-size: 13px;
      line-height: 1.6;
    }

    .catalog-no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #999999;
      font-size: 12px;
    }

    .catalog-form-group {
      margin-bottom: 15px;
    }

    .catalog-form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #333333;
    }

    .catalog-form-group input,
    .catalog-form-group select,
    .catalog-form-group textarea {
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 4px;
      padding: 10px;
      outline: none;
      background: #ffffff;
      font-size: 13px;
    }

    .catalog-form-group input:focus,
    .catalog-form-group select:focus,
    .catalog-form-group textarea:focus {
      border-color: #999999;
    }

    .catalog-form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 14px;
    }

    .catalog-primary {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 4px;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .catalog-primary:hover {
      background: #000000;
    }

    .catalog-quantity {
      width: fit-content;
      display: flex;
      align-items: center;
      border: 1px solid #dddddd;
      border-radius: 4px;
      overflow: hidden;
    }

    .catalog-quantity button {
      width: 36px;
      height: 36px;
      border: 0;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 18px;
    }

    .catalog-quantity span {
      min-width: 40px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .catalog-selected-price {
      margin: 14px 0;
      font-size: 21px;
      font-weight: 800;
    }

    /* ==============================
       CARRINHO
       ============================== */

    .cart-card {
      max-width: 760px;
    }

    #cartContent {
      padding: 22px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 15px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .cart-item-image {
      width: 82px;
      height: 82px;
      border-radius: 6px;
      background: #f6f6f6;
      object-fit: contain;
      display: block;
    }

    .cart-item > div:nth-child(2) {
      min-width: 0;
    }

    .cart-item-name {
      color: #222222;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .cart-item-variation {
      margin-top: 4px;
      color: #777777;
      font-size: 12px;
    }

    .cart-item-observation {
      margin-top: 6px;
      color: #888888;
      font-size: 11px;
      line-height: 1.4;
    }

    .cart-item > div:nth-child(2) > div[style] {
      margin-top: 5px !important;
      color: #777777 !important;
      font-size: 11px !important;
    }

    .cart-item-price {
      white-space: nowrap;
      color: #222222;
      font-size: 15px;
      font-weight: 800;
    }

    .cart-item-remove {
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #888888;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    .cart-item-remove:hover {
      color: #d00000;
    }

    .cart-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 15px;
      margin-top: 5px;
      border-top: 1px solid #eeeeee;
    }

    .cart-total span:first-child {
      color: #555555;
      font-size: 14px;
      font-weight: 600;
    }

    .cart-total span:last-child {
      color: #222222;
      font-size: 22px;
      font-weight: 800;
    }

    .cart-actions {
      padding-top: 5px;
    }

    .cart-actions .catalog-primary {
      width: 100%;
    }

    /* ==============================
       CHECKOUT
       ============================== */

    .checkout-card {
      max-width: 850px;
    }

    #checkoutContent {
      padding: 22px;
    }

    .catalog-checkout-section,
    .checkout-section {
      margin-bottom: 25px;
    }

    .catalog-checkout-section h3,
    .checkout-section h3 {
      margin: 0 0 15px;
      padding-bottom: 9px;
      border-bottom: 1px solid #eeeeee;
      font-size: 16px;
    }

    .catalog-checkout-footer,
    .checkout-footer {
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
    }

    .catalog-checkout-footer > strong {
      display: block;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .checkout-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: 800;
    }

    .checkout-required {
      color: #d00000;
    }

    .catalog-order-success {
      padding: 50px 25px;
      text-align: center;
    }

    .success-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222222;
      color: #ffffff;
      font-size: 28px;
      font-weight: bold;
    }

    .catalog-order-success h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .catalog-order-success p {
      color: #777777;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 auto 20px;
      max-width: 500px;
    }

    /* ==============================
       RESPONSIVO
       ============================== */

    @media (max-width: 1000px) {
      .catalog-products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {

      .catalog-main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .catalog-store-name {
        font-size: 24px !important;
      }

      .catalog-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .catalog-cart-button {
        width: 100%;
      }

      .catalog-products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .catalog-product > .catalog-product-image {
        height: 125px !important;
        max-height: 125px !important;
        min-height: 125px !important;
      }

      .catalog-product-no-image {
        height: 125px !important;
        max-height: 125px !important;
        min-height: 125px !important;
      }

      .catalog-product-body {
        padding: 9px;
      }

      .catalog-product-name {
        font-size: 12px;
      }

      .catalog-product-description {
        font-size: 10px;
        height: 28px;
      }

      .catalog-product-price {
        font-size: 14px;
      }

      .catalog-product-action {
        height: 34px;
        font-size: 10px;
      }

      .catalog-product-detail {
        grid-template-columns: 1fr;
        padding: 15px;
      }

      .catalog-product-detail > .catalog-product-image {
        height: 240px !important;
        max-height: 240px !important;
        min-height: 240px !important;
      }

      .catalog-form-grid {
        grid-template-columns: 1fr;
      }

      /* Carrinho mobile */

      .cart-card {
        max-width: 100%;
      }

      #cartContent {
        padding: 16px;
      }

      .cart-item {
        grid-template-columns: 65px minmax(0, 1fr);
        gap: 11px;
        padding: 13px 0;
      }

      .cart-item-image {
        width: 65px;
        height: 65px;
      }

      .cart-item-price {
        grid-column: 2;
        margin-top: 3px;
        font-size: 14px;
      }

      .cart-item-remove {
        margin-top: 5px;
      }

      .cart-total {
        padding-top: 17px;
      }

      .cart-total span:last-child {
        font-size: 19px;
      }
    }

    @media (max-width: 420px) {

      .catalog-navigation {
        gap: 18px;
      }

      .catalog-navigation a {
        font-size: 10px;
      }

      .catalog-products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .catalog-product > .catalog-product-image {
        height: 110px !important;
        max-height: 110px !important;
        min-height: 110px !important;
      }

      .catalog-product-no-image {
        height: 110px !important;
        max-height: 110px !important;
        min-height: 110px !important;
      }

      .catalog-product-body {
        padding: 8px;
      }

      .catalog-product-name {
        font-size: 11px;
      }

      .catalog-product-price {
        font-size: 13px;
      }

      .cart-item {
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 9px;
      }

      .cart-item-image {
        width: 58px;
        height: 58px;
      }

      .cart-item-name {
        font-size: 13px;
      }

      .cart-item-variation {
        font-size: 11px;
      }

      .cart-item-price {
        font-size: 13px;
      }

      .cart-total span:last-child {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="app" class="catalog-app">

    <div id="menu" style="display:none;"></div>

    <main class="catalog-main">

      <header class="catalog-header">

        <div
          class="catalog-store-name"
          id="catalogStoreName"
        >
          Catálogo
        </div>

        <div class="catalog-subtitle">
          Produtos disponíveis
        </div>

      </header>

      <nav class="catalog-navigation">

        <a href="#catalogProducts">
          Produtos
        </a>

        <a href="#catalogProducts">
          Catálogo
        </a>

        <a
          href="#"
          onclick="openCart(); return false;"
        >
          Carrinho
        </a>

      </nav>

      <div class="catalog-toolbar">

        <div class="catalog-search-box">

          <input
            type="text"
            id="catalogSearch"
            placeholder="Buscar produto..."
            oninput="renderCatalog()"
          >

        </div>

        <button
          class="catalog-cart-button"
          onclick="openCart()"
        >
          🛒

          <span>
            Carrinho
          </span>

          <b id="cartCount">
            0
          </b>

        </button>

      </div>

      <div
        id="catalogProducts"
        class="catalog-products"
      >

        <div class="catalog-loading">
          Carregando catálogo...
        </div>

      </div>

    </main>

  </div>


  <!-- MODAL PRODUTO -->

  <div
    id="productModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card">

      <div class="catalog-modal-head">

        <h2 id="productModalTitle">
          Produto
        </h2>

        <button
          class="catalog-close"
          onclick="closeProductModal()"
        >
          ×
        </button>

      </div>

      <div id="productModalContent"></div>

    </div>

  </div>


  <!-- MODAL CARRINHO -->

  <div
    id="cartModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card cart-card">

      <div class="catalog-modal-head">

        <h2>
          Meu carrinho
        </h2>

        <button
          class="catalog-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>

      <div id="cartContent"></div>

    </div>

  </div>


  <!-- MODAL CHECKOUT -->

  <div
    id="checkoutModal"
    class="catalog-modal hidden"
  >

    <div class="catalog-modal-card checkout-card">

      <div class="catalog-modal-head">

        <h2>
          Finalizar pedido
        </h2>

        <button
          class="catalog-close"
          onclick="closeCheckout()"
        >
          ×
        </button>

      </div>

      <div id="checkoutContent"></div>

    </div>

  </div>

</body>
</html>
